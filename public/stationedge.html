<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StationEdge | PolyScan</title>
<style>
:root{--bg:#07100e;--panel:#0f1c18;--line:#263832;--text:#edf6f2;--muted:#91a79f;--green:#4fe08c;--red:#ff7373}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}
header{padding:18px 4%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header span,.green{color:var(--green)}header small,p{color:var(--muted)}
main{max-width:1400px;margin:auto;padding:28px 4%}.top,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
button{background:var(--green);border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card,.detail section,.hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card{cursor:pointer}.card h2{margin:0 0 4px}.code{color:var(--muted)}.state{font-size:11px;border:1px solid var(--line);padding:6px;border-radius:20px}
.temp{font-size:34px;font-weight:900;margin:18px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metrics small,small{display:block;color:var(--muted);font-size:10px}.metrics strong{display:block;margin-top:5px}.red{color:var(--red)}
.eligible{margin-top:16px;padding:8px;text-align:center;border-radius:7px;font-weight:800;font-size:12px}.eligible.yes{background:#143b29;color:var(--green)}.eligible.no{background:#392020;color:var(--red)}
.hero{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.detail section{margin-top:14px}.score{font-size:48px;font-weight:900}.line{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0}
.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}pre{white-space:pre-wrap;color:#cfe0da}.hidden{display:none}
@media(max-width:700px){.two,.hero{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head>
<body><header><b>POLYSCAN <span>STATIONEDGE</span></b><small>Exact-station weather intelligence · WU excluded</small></header>
<main><div id="list"><div class="top"><div><h1>15 Resolution Stations</h1><p>Stability Scanner and Pattern Day are separate. Both turn green at 70%.</p></div><button onclick="load()">Refresh</button></div><div id="grid" class="grid"></div></div>
<div id="detail" class="detail hidden"></div></main>
<script>
const fmt=v=>Number.isFinite(v)?v.toFixed(1)+'°C':'—';
async function load(){document.getElementById('grid').innerHTML='<p>Loading exact station data…</p>';const r=await fetch('/api/stationedge/stations');const rows=await r.json();window.stationRows=rows;
document.getElementById('grid').innerHTML=rows.map(s=>`<div class="card" onclick="openStation('${s.code}')"><div class="row"><div><h2>${s.city}</h2><b class="code">${s.code}</b></div><span class="state">${s.state||'ERROR'}</span></div>${s.error?`<p class="red">${s.error}</p>`:`<div class="temp">${fmt(s.latest?.temperatureC)}</div><div class="metrics"><div><small>OBS MAX</small><strong>${fmt(s.observedMax)}</strong></div><div><small>STABILITY</small><strong class="${s.stability>=70?'green':'red'}">${s.stability}%</strong></div><div><small>PATTERN DAY</small><strong class="${s.pattern>=70?'green':'red'}">${s.pattern}%</strong></div></div><div class="eligible ${s.tradeable?'yes':'no'}">${s.tradeable?'GREEN / TRADEABLE':'FILTERED / WATCH'}</div>`}</div>`).join('')}
function openStation(code){const s=window.stationRows.find(x=>x.code===code);if(!s||s.error)return;document.getElementById('list').classList.add('hidden');const d=document.getElementById('detail');d.classList.remove('hidden');
d.innerHTML=`<button onclick="back()">← Dashboard</button><h1>${s.city} — ${s.code}</h1><p>${s.station} · ${s.latest?.source||s.source}</p><div class="hero"><div><small>CURRENT</small><div class="temp">${fmt(s.latest?.temperatureC)}</div></div><div><small>OBSERVED MAX</small><div class="temp">${fmt(s.observedMax)}</div></div><div><small>STATE</small><h2>${s.state}</h2></div></div>
<div class="two"><section><h2>Stability Scanner</h2><div class="score ${s.stability>=70?'green':'red'}">${s.stability}%</div>${Object.entries(s.stabilityParts).map(([k,v])=>`<div class="line"><span>${k}</span><b>${v}%</b></div>`).join('')}</section>
<section><h2>Pattern Day</h2><div class="score ${s.pattern>=70?'green':'red'}">${s.pattern}%</div><div class="line"><span>Dominant pattern</span><b>${s.patternParts.dominant}</b></div><div class="line"><span>Observed regime changes</span><b>${s.patternParts.changes}</b></div><div class="line"><span>Forecast transition markers</span><b>${s.patternParts.markers}</b></div></section></div>
<section><h2>Exact-station curve</h2><div class="table"><table><tr><th>UTC</th><th>Temp</th><th>Dew point</th><th>Humidity</th><th>Wind kt</th><th>Clouds</th><th>Weather</th></tr>${s.observations.slice().reverse().map(o=>`<tr><td>${new Date(o.observedAt).toISOString().slice(5,16).replace('T',' ')}</td><td>${o.temperatureC??'—'}</td><td>${o.dewpointC?.toFixed?.(1)??'—'}</td><td>${o.humidityPct??'—'}</td><td>${o.windSpeedKt??'—'}</td><td>${o.clouds||'—'}</td><td>${o.weather||'—'}</td></tr>`).join('')}</table></div></section>
<section><h2>Official forecast layer</h2><pre>${s.forecast||'No forecast returned for this station.'}</pre></section>`}
function back(){document.getElementById('detail').classList.add('hidden');document.getElementById('list').classList.remove('hidden')}
load();
</script></body></html>
